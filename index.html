<style>

.dtbl tr.rd td.ytot{background:#DDE8F5}.dtbl tr.rd td.ytot25{background:#E8EEF4;color:var(--text3)}
.etabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.etab,.cotab{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;font-family:var(--mono);font-weight:500}
.etab:hover,.cotab:hover{border-color:var(--blue);color:var(--blue)}

<script>
const CSV_URLS={
  ALPS:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vRy1TjYnEJ36l49q0oWFVfTjwfOfK74t45oXgoW2_7LZIPEry0HuXoevkm3dIYIMwiZMpUL_W4KR3Ei/pub?gid=201022155&single=true&output=csv',
  ALICLER:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRy1TjYnEJ36l49q0oWFVfTjwfOfK74t45oXgoW2_7LZIPEry0HuXoevkm3dIYIMwiZMpUL_W4KR3Ei/pub?gid=1424606901&single=true&output=csv',
  OMAN:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vRy1TjYnEJ36l49q0oWFVfTjwfOfK74t45oXgoW2_7LZIPEry0HuXoevkm3dIYIMwiZMpUL_W4KR3Ei/pub?gid=1881988227&single=true&output=csv',
  SS:     'https://docs.google.com/spreadsheets/d/e/2PACX-1vRy1TjYnEJ36l49q0oWFVfTjwfOfK74t45oXgoW2_7LZIPEry0HuXoevkm3dIYIMwiZMpUL_W4KR3Ei/pub?gid=1126609662&single=true&output=csv',
  KSA:    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRy1TjYnEJ36l49q0oWFVfTjwfOfK74t45oXgoW2_7LZIPEry0HuXoevkm3dIYIMwiZMpUL_W4KR3Ei/pub?gid=1405193407&single=true&output=csv',
  ALPS_BR:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRy1TjYnEJ36l49q0oWFVfTjwfOfK74t45oXgoW2_7LZIPEry0HuXoevkm3dIYIMwiZMpUL_W4KR3Ei/pub?gid=781070140&single=true&output=csv',
  ALPS_UZ:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRy1TjYnEJ36l49q0oWFVfTjwfOfK74t45oXgoW2_7LZIPEry0HuXoevkm3dIYIMwiZMpUL_W4KR3Ei/pub?gid=1975420796&single=true&output=csv',
};

const COMPANIES={
  ALPS:{name:'Al Laith Projects (ALPS)',short:'ALPS'},
  ALICLER:{name:'ALICLER',short:'ALICLER'},
  OMAN:{name:'Oman Operations',short:'OMAN'},
  SS:{name:'Site Services (SS)',short:'SS'},
  KSA:{name:'KSA — Al Laith United',short:'KSA'},
  ALPS_BR:{name:'ALPS BR',short:'ALPS BR'},
  ALPS_UZ:{name:'ALPS UZ',short:'ALPS UZ'},
};
const CO_KEYS=Object.keys(COMPANIES);
const COLORS=['#1A5E9E','#0E7B4A','#C08B1A','#8B2355','#533C7D','#0E6E78','#7C3F00'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const MON_COLS={Jan:151,Feb:157,Mar:163,Apr:164,May:165,Jun:166,Jul:167,Aug:168,Sep:169,Oct:170,Nov:171,Dec:172,Total_2026:173,Total_2025:174};
const WK_COLS={Jan_W1:147,Jan_W2:148,Jan_W3:149,Jan_W4:150,Jan_TOT:151,Feb_W1:152,Feb_W2:153,Feb_W3:154,Feb_W4:155,Feb_TOT:157,Mar_W1:158,Mar_W2:159,Mar_W3:160,Mar_W4:161,Mar_TOT:163};
const ALL_COLS={...MON_COLS,...WK_COLS};

const KEY_ROWS={opening:10,total_inflows:32,total_outflows:101,closing:103,collect_gt1:16,collect_12m:17,debt_pre21:18,debt_2021:19,debt_2022:20,debt_2023:21,advance:26,interco:28,others_in:30,payments:36,subcon:37,proj_exp:38,fixed_svc:40,pay_adv:41,salaries:59,manpower:60,telecom:61,utility:62,rent:63,auto_loan:64,mortgage:65,fuel:68,vat:72,insurance:76,capex:98};

const DETAIL_ROWS=[
  [10,'Opening Cash Balance','total'],
  [12,'ESTIMATED CASH INFLOWS','section'],
  [16,'Collect Forecast >1 Year Debt','detail'],
  [17,'Collect Forecast 12 Months Debt','detail'],
  [18,'Debt Collection Pre-2021','detail'],
  [19,'Debt Collection 2021','detail'],
  [20,'Debt Collection 2022','detail'],
  [21,'Debt Collection 2023','detail'],
  [26,'Advance Received','detail'],
  [28,'Intercompany Transfers','detail'],
  [30,'Others (Inflow)','detail'],
  [32,'TOTAL INFLOWS','total'],
  [34,'ESTIMATED CASH OUTFLOWS','section'],
  [36,'Payments to Suppliers','detail'],
  [37,'Sub Contractors','detail'],
  [38,'Project Expenses','detail'],
  [40,'Payment for Fixed Services','detail'],
  [41,'Payments in Advance','detail'],
  [45,'> 180 Days','detail'],
  [46,'91-180 Days','detail'],
  [47,'31-90 Days','detail'],
  [48,'0-30 Days','detail'],
  [53,'Total Supplier Payments','subtotal'],
  [58,'Fixed Cash Expenses','section'],
  [59,'Salaries & Wages','detail'],
  [60,'Manpower Supplies','detail'],
  [61,'Telecommunication','detail'],
  [62,'Utility','detail'],
  [63,'Rent','detail'],
  [64,'Auto Loan','detail'],
  [65,'Mortgage','detail'],
  [68,'Fuel','detail'],
  [70,'Bank Charges','detail'],
  [71,'Bank Guarantees','detail'],
  [72,'VAT / Tax','detail'],
  [73,'Trade License','detail'],
  [76,'Insurance','detail'],
  [77,'Credit Cards','detail'],
  [78,'Petty Cash','detail'],
  [79,'Office & IT Maintenance','detail'],
  [80,'Sub-total Fixed Expenses','subtotal'],
  [82,'Variable Cash Expenses','section'],
  [83,'Bonus','detail'],
  [84,'Final Settlement / Leave Salary','detail'],
  [86,'Staff Ticket / Travel','detail'],
  [88,'Marketing & Branding','detail'],
  [90,'Intercompany Loan / Dividend','detail'],
  [92,'Legal & Professional Fees','detail'],
  [96,'Sub-total Variable Expenses','subtotal'],
  [98,'Capital Expenses (CAPEX)','detail'],
  [101,'TOTAL OUTFLOWS','total'],
  [103,'CLOSING CASH BALANCE','total'],
];

let DATA={}, DETAIL={}, dataLoaded=false;
let currentTab='dashboard', charts={};
let _eco='ALPS',_wco='ALPS',_mco='ALPS';
let refreshTimer=null;

function parseCSV(text){
  const rows=[];
  const lines=text.split('\n');
  for(const line of lines){
    const row=[], re=/("([^"]*)")|([^,]*)/g;
    let m;
    while((m=re.exec(line))!==null){
      if(m.index===re.lastIndex)re.lastIndex++;
      row.push((m[2]!==undefined?m[2]:m[3]||'').trim());
    }
    rows.push(row);
  }
  return rows;
}

function getCell(rows,rowIdx,colIdx){
  if(rowIdx>=rows.length)return 0;
  const row=rows[rowIdx];
  if(colIdx>=row.length)return 0;
  const v=row[colIdx].replace(/,/g,'');
  const n=parseFloat(v);
  return isNaN(n)?0:Math.round(n*100)/100;
}

async function fetchCSV(url){
  const res=await fetch(url);
  if(!res.ok)throw new Error(`HTTP ${res.status}`);
  return parseCSV(await res.text());
}

async function loadCo(co){
  const rows=await fetchCSV(CSV_URLS[co]);
  const summary={};
  Object.entries(KEY_ROWS).forEach(([metric,ri])=>{
    summary[metric]={};
    Object.entries(ALL_COLS).forEach(([p,ci])=>{summary[metric][p]=getCell(rows,ri,ci);});
  });
  DATA[co]=summary;
  const detail=DETAIL_ROWS.map(([ri,label,type])=>{
    const vals={};
    Object.entries(MON_COLS).forEach(([p,ci])=>{vals[p]=getCell(rows,ri,ci);});
    return{label,type,values:vals};
  });
  DETAIL[co]=detail;
}

async function refreshAll(){
  showLoad('Refreshing from Google Sheets...');
  setBar(5);
  const errs=[];
  for(let i=0;i<CO_KEYS.length;i++){
    const co=CO_KEYS[i];
    setLoadTxt(`Loading ${COMPANIES[co].name}...`);
    try{await loadCo(co);}catch(e){errs.push(`${co}: ${e.message}`);}
    setBar(5+(i+1)/CO_KEYS.length*90);
  }
  setBar(100);
  dataLoaded=true;
  hideLoad();
  document.getElementById('liveDot').style.display='block';
  document.getElementById('liveLabel').style.display='block';
  document.getElementById('lastRefresh').textContent='Refreshed: '+new Date().toLocaleTimeString('en-AE',{hour:'2-digit',minute:'2-digit'});
  if(errs.length)console.warn('Errors:',errs);
  render();
}

function showLoad(t){document.getElementById('loadWrap').classList.add('show');setLoadTxt(t);}
function hideLoad(){document.getElementById('loadWrap').classList.remove('show');setBar(0);}
function setBar(p){document.getElementById('loadingBar').style.width=p+'%';}
function setLoadTxt(t){document.getElementById('loadTxt').textContent=t;}

function g(co,m,p){return DATA[co]?.[m]?.[p]||0;}
function fmt(n){if(n===undefined||n===null||isNaN(n))return'—';return n.toLocaleString('en-AE',{minimumFractionDigits:1,maximumFractionDigits:1});}
function fmtM(n){const a=Math.abs(n);if(a>=1000)return(n<0?'-':'')+Math.abs(n/1000).toFixed(1)+'M';return(n<0?'-':'')+Math.abs(n).toFixed(0)+'K';}
function activeCos(){const s=document.getElementById('coSel').value;return s==='ALL'?CO_KEYS:[s];}
function switchTab(tab,el){currentTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render();}
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};}
function render(){if(!dataLoaded)return;destroyCharts();if(currentTab==='dashboard')renderDashboard();else if(currentTab==='entity')renderEntity();else if(currentTab==='weekly')renderWeekly();else if(currentTab==='monthly')renderMonthly();else if(currentTab==='group')renderGroup();}
function goEntity(co){_eco=co;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab')[1].classList.add('active');currentTab='entity';render();}

function renderDashboard(){
  const cos=activeCos();
  const tIn=cos.reduce((s,co)=>s+g(co,'total_inflows','Total_2026'),0);
  const tOut=cos.reduce((s,co)=>s+g(co,'total_outflows','Total_2026'),0);
  const net=tIn-tOut,open=cos.reduce((s,co)=>s+g(co,'opening','Total_2026'),0),close=cos.reduce((s,co)=>s+g(co,'closing','Total_2026'),0);
  const in25=cos.reduce((s,co)=>s+g(co,'total_inflows','Total_2025'),0);
  const yoy=in25>0?((tIn-in25)/in25*100):0;
  const inD=MONTHS.map(p=>+(cos.reduce((s,co)=>s+g(co,'total_inflows',p),0)).toFixed(1));
  const outD=MONTHS.map(p=>+(cos.reduce((s,co)=>s+g(co,'total_outflows',p),0)).toFixed(1));
  const clD=MONTHS.map(p=>+(cos.reduce((s,co)=>s+g(co,'closing',p),0)).toFixed(1));
  const cards=CO_KEYS.map((co,i)=>{
    const cl=g(co,'closing','Total_2026'),inf=g(co,'total_inflows','Total_2026'),nt=inf-g(co,'total_outflows','Total_2026');
    const pct=tIn>0?Math.max(0,Math.min(100,Math.max(0,inf)/tIn*100)):0;
    return`<div class="co-card" onclick="goEntity('${co}')"><div class="co-card-hdr"><div class="co-name">${COMPANIES[co].name}${cl<0?'<span class="warn-badge">NEGATIVE</span>':''}</div><span class="co-pill" style="background:${COLORS[i]}18;color:${COLORS[i]}">${COMPANIES[co].short}</span></div><div class="co-val ${cl>=0?'pos':'neg'}">${fmt(cl)}</div><div class="co-note">Dec 2026 closing · click for detail</div><div class="pbar"><div class="pfill" style="width:${pct.toFixed(1)}%;background:${COLORS[i]}"></div></div><div class="co-foot"><span>Net: <b style="color:${nt>=0?'var(--green)':'var(--red)'}">${fmt(nt)}</b></span><span>In: ${fmt(inf)}</span></div></div>`;
  }).join('');
  document.getElementById('mainContent').innerHTML=`
    <div class="kpi-grid">
      <div class="kpi green"><div class="kpi-label">Total inflows 2026</div><div class="kpi-val pos">${fmt(tIn)}</div><div class="kpi-sub">YoY: ${yoy>=0?'+':''}${yoy.toFixed(1)}% vs 2025</div></div>
      <div class="kpi red"><div class="kpi-label">Total outflows 2026</div><div class="kpi-val neg">${fmt(tOut)}</div></div>
      <div class="kpi ${net>=0?'teal':'red'}"><div class="kpi-label">Net cash movement</div><div class="kpi-val ${net>=0?'pos':'neg'}">${fmt(net)}</div></div>
      <div class="kpi blue"><div class="kpi-label">Opening balance</div><div class="kpi-val">${fmt(open)}</div><div class="kpi-sub">1 Jan 2026</div></div>
      <div class="kpi gold"><div class="kpi-label">Closing balance</div><div class="kpi-val">${fmt(close)}</div><div class="kpi-sub">31 Dec 2026</div></div>
    </div>
    <div class="co-grid">${cards}</div>
    <div class="sec"><div class="sec-title">&#9646; Monthly inflows vs outflows — 2026</div>
      <div class="legend"><div class="leg"><div class="leg-dot" style="background:#1A5E9E"></div>Inflows</div><div class="leg"><div class="leg-dot" style="background:#B03A2E"></div>Outflows</div></div>
      <div class="chart-wrap"><canvas id="c1" role="img" aria-label="Monthly inflows and outflows 2026"></canvas></div></div>
    <div class="sec"><div class="sec-title">&#9646; Closing balance trend — 2026</div>
      <div class="chart-wrap-sm"><canvas id="c2" role="img" aria-label="Closing balance trend 2026"></canvas></div></div>`;
  setTimeout(()=>{
    const c1=document.getElementById('c1');
    if(c1)charts.c1=new Chart(c1,{type:'bar',data:{labels:MONTHS,datasets:[{label:'Inflows',data:inD,backgroundColor:'#1A5E9E30',borderColor:'#1A5E9E',borderWidth:1.5},{label:'Outflows',data:outD,backgroundColor:'#B03A2E30',borderColor:'#B03A2E',borderWidth:1.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:11},autoSkip:false,maxRotation:0}},y:{ticks:{callback:v=>fmtM(v),font:{size:10}},grid:{color:'#E8EBF2'}}}}});
    const c2=document.getElementById('c2');
    if(c2)charts.c2=new Chart(c2,{type:'line',data:{labels:MONTHS,datasets:[{label:'Closing',data:clD,borderColor:'#1A5E9E',backgroundColor:'#1A5E9E10',fill:true,tension:0.35,pointRadius:4,pointBackgroundColor:'#1A5E9E'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:11}}},y:{ticks:{callback:v=>fmtM(v),font:{size:10}},grid:{color:'#E8EBF2'}}}}});
  },60);
}

function renderEntity(){
  if(!CO_KEYS.includes(_eco))_eco=CO_KEYS[0];
  const ci=CO_KEYS.indexOf(_eco),color=COLORS[ci];
  const rows=DETAIL[_eco]||[];
  const periods=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Total_2026','Total_2025'];
  const pLbls=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','2026 Total','2025 Total'];
  const etabs=CO_KEYS.map((co,i)=>`<button class="etab${_eco===co?' active':''}" style="${_eco===co?'background:'+COLORS[i]+';border-color:'+COLORS[i]+';':''}" onclick="_eco='${co}';renderEntity()">${COMPANIES[co].short}</button>`).join('');
  let tbody='';
  rows.forEach(r=>{
    const vals=periods.map(p=>{
      const v=r.values?.[p]||0,isY=p==='Total_2026',isY25=p==='Total_2025';
      const cls=isY?'ytot':isY25?'ytot25':'';
      if(r.type==='section')return`<td class="${cls}"></td>`;
      const nc=v<0?'neg':v>0.001?'pos':'mu';
      return`<td class="num ${nc} ${cls}">${Math.abs(v)<0.005?'<span class="mu">—</span>':fmt(v)}</td>`;
    }).join('');
    if(r.type==='section')tbody+=`<tr class="rs"><td class="lbl" colspan="${periods.length+1}">${r.label}</td></tr>`;
    else if(r.type==='total')tbody+=`<tr class="rt"><td class="lbl">${r.label}</td>${vals}</tr>`;
    else if(r.type==='subtotal')tbody+=`<tr class="rsu"><td class="lbl">${r.label}</td>${vals}</tr>`;
    else{if(!periods.some(p=>Math.abs(r.values?.[p]||0)>0.01))return;tbody+=`<tr class="rd"><td class="lbl ind">${r.label}</td>${vals}</tr>`;}
  });
  const ths=pLbls.map((l,i)=>`<th class="${periods[i]==='Total_2026'?'ytot':periods[i]==='Total_2025'?'ytot25':''}">${l}</th>`).join('');
  const chartIn=MONTHS.map(p=>+g(_eco,'total_inflows',p).toFixed(1));
  const chartOut=MONTHS.map(p=>+g(_eco,'total_outflows',p).toFixed(1));
  const chartCl=MONTHS.map(p=>+g(_eco,'closing',p).toFixed(1));
  const tIn=g(_eco,'total_inflows','Total_2026'),tOut=g(_eco,'total_outflows','Total_2026'),net=tIn-tOut,cl=g(_eco,'closing','Total_2026'),op=g(_eco,'opening','Jan');
  document.getElementById('mainContent').innerHTML=`
    <div class="sec" style="border-left:4px solid ${color}">
      <div class="etabs">${etabs}</div>
      <div class="info-row"><span style="font-weight:600;color:${color};font-size:13px">${COMPANIES[_eco].name}</span><span>·</span><span>Full monthly detail — Jan to Dec 2026</span>${cl<0?'<span class="warn-badge">&#9888; NEGATIVE CLOSING</span>':''}</div>
      <div class="kpi-grid" style="margin-bottom:14px">
        <div class="kpi green"><div class="kpi-label">Total inflows</div><div class="kpi-val pos" style="font-size:17px">${fmt(tIn)}</div></div>
        <div class="kpi red"><div class="kpi-label">Total outflows</div><div class="kpi-val neg" style="font-size:17px">${fmt(tOut)}</div></div>
        <div class="kpi ${net>=0?'teal':'red'}"><div class="kpi-label">Net movement</div><div class="kpi-val ${net>=0?'pos':'neg'}" style="font-size:17px">${fmt(net)}</div></div>
        <div class="kpi blue"><div class="kpi-label">Opening balance</div><div class="kpi-val" style="font-size:17px">${fmt(op)}</div></div>
        <div class="kpi gold"><div class="kpi-label">Closing balance</div><div class="kpi-val ${cl>=0?'':'neg'}" style="font-size:17px">${fmt(cl)}</div></div>
      </div>
      <div class="grid2" style="margin-bottom:14px">
        <div><div class="sec-title">Monthly inflows vs outflows</div>
          <div class="legend"><div class="leg"><div class="leg-dot" style="background:${color}"></div>Inflows</div><div class="leg"><div class="leg-dot" style="background:#B03A2E"></div>Outflows</div></div>
          <div class="chart-wrap-sm"><canvas id="ec1" role="img" aria-label="Entity inflows vs outflows"></canvas></div></div>
        <div><div class="sec-title">Closing balance trajectory</div>
          <div class="chart-wrap-sm"><canvas id="ec2" role="img" aria-label="Entity closing balance"></canvas></div></div>
      </div>
    </div>
    <div class="sec"><div class="sec-title">&#9646; All line items — monthly</div>
      <div class="scroll-x"><table class="dtbl"><thead><tr><th class="lbl">Line Item</th>${ths}</tr></thead><tbody>${tbody}</tbody></table></div></div>`;
  setTimeout(()=>{
    const c1=document.getElementById('ec1');
    if(c1)charts.ec1=new Chart(c1,{type:'bar',data:{labels:MONTHS,datasets:[{label:'In',data:chartIn,backgroundColor:color+'30',borderColor:color,borderWidth:1.5},{label:'Out',data:chartOut,backgroundColor:'#B03A2E30',borderColor:'#B03A2E',borderWidth:1.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10},autoSkip:false,maxRotation:0}},y:{ticks:{callback:v=>fmtM(v),font:{size:9}},grid:{color:'#E8EBF2'}}}}});
    const c2=document.getElementById('ec2');
    if(c2)charts.ec2=new Chart(c2,{type:'line',data:{labels:MONTHS,datasets:[{label:'Close',data:chartCl,borderColor:color,backgroundColor:color+'12',fill:true,tension:0.3,pointRadius:4,pointBackgroundColor:color}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{callback:v=>fmtM(v),font:{size:9}},grid:{color:'#E8EBF2'}}}}});
  },60);
}

function renderWeekly(){
  if(!CO_KEYS.includes(_wco))_wco=CO_KEYS[0];
  const color=COLORS[CO_KEYS.indexOf(_wco)];
  const coTabs=CO_KEYS.map((c,i)=>`<button class="cotab${_wco===c?' active':''}" style="${_wco===c?'background:'+COLORS[i]+';border-color:'+COLORS[i]:''}" onclick="_wco='${c}';renderWeekly()">${COMPANIES[c].short}</button>`).join('');
  const wkP=Object.keys(WK_COLS);
  const wkL=['W1 1-13','W2 14-20','W3 21-27','W4 28-31','JAN TOT','W1 1-10','W2 11-17','W3 18-24','W4 25-28','FEB TOT','W1 1-10','W2 11-17','W3 18-24','W4 25-31','MAR TOT'];
  const isTot=p=>p.includes('TOT');
  const rows=[{label:'Opening balance',m:'opening',cls:'rt'},{label:'Total inflows',m:'total_inflows',cls:'rsu'},{label:'Total outflows',m:'total_outflows',cls:'rsu'},{label:'Net movement',m:'net',cls:'rsu'},{label:'Closing balance',m:'closing',cls:'rt'}];
  const trs=rows.map(r=>{const cells=wkP.map(p=>{const v=r.m==='net'?g(_wco,'total_inflows',p)-g(_wco,'total_outflows',p):g(_wco,r.m,p);return`<td class="num ${v<0?'neg':'pos'} ${isTot(p)?'ytot':''}">${fmt(v)}</td>`;}).join('');return`<tr class="${r.cls}"><td class="lbl">${r.label}</td>${cells}</tr>`;}).join('');
  const ths=wkP.map((p,i)=>`<th class="${isTot(p)?'ytot':''}">${wkL[i]}</th>`).join('');
  const cIn=wkP.map(p=>+g(_wco,'total_inflows',p).toFixed(1)),cOut=wkP.map(p=>+g(_wco,'total_outflows',p).toFixed(1)),cCl=wkP.map(p=>+g(_wco,'closing',p).toFixed(1));
  document.getElementById('mainContent').innerHTML=`
    <div class="sec"><div class="sec-title">&#9646; Weekly cash flow — Jan to Mar 2026</div>
      <div class="cotabs">${coTabs}</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:10px">${COMPANIES[_wco].name} · AED 000's</div>
      <div class="scroll-x"><table class="dtbl"><thead><tr><th class="lbl">Description</th>${ths}</tr></thead><tbody>${trs}</tbody></table></div></div>
    <div class="grid2">
      <div class="sec"><div class="sec-title">&#9646; Weekly inflows vs outflows</div>
        <div class="legend"><div class="leg"><div class="leg-dot" style="background:${color}"></div>Inflows</div><div class="leg"><div class="leg-dot" style="background:#B03A2E"></div>Outflows</div></div>
        <div class="chart-wrap"><canvas id="wc1" role="img" aria-label="Weekly inflows vs outflows"></canvas></div></div>
      <div class="sec"><div class="sec-title">&#9646; Weekly closing balance</div>
        <div class="chart-wrap"><canvas id="wc2" role="img" aria-label="Weekly closing balance"></canvas></div></div>
    </div>`;
  setTimeout(()=>{
    const c1=document.getElementById('wc1');
    if(c1)charts.wc1=new Chart(c1,{type:'bar',data:{labels:wkL,datasets:[{label:'In',data:cIn,backgroundColor:color+'30',borderColor:color,borderWidth:1.5},{label:'Out',data:cOut,backgroundColor:'#B03A2E30',borderColor:'#B03A2E',borderWidth:1.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9},autoSkip:false,maxRotation:40}},y:{ticks:{callback:v=>fmtM(v),font:{size:9}},grid:{color:'#E8EBF2'}}}}});
    const c2=document.getElementById('wc2');
    if(c2)charts.wc2=new Chart(c2,{type:'line',data:{labels:wkL,datasets:[{label:'Close',data:cCl,borderColor:color,backgroundColor:color+'10',fill:true,tension:0.2,pointRadius:4,pointBackgroundColor:color}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9},autoSkip:false,maxRotation:40}},y:{ticks:{callback:v=>fmtM(v),font:{size:9}},grid:{color:'#E8EBF2'}}}}});
  },60);
}

function renderMonthly(){
  if(!CO_KEYS.includes(_mco))_mco=CO_KEYS[0];
  const coTabs=CO_KEYS.map((c,i)=>`<button class="cotab${_mco===c?' active':''}" style="${_mco===c?'background:'+COLORS[i]+';border-color:'+COLORS[i]:''}" onclick="_mco='${c}';renderMonthly()">${COMPANIES[c].short}</button>`).join('');
  const moPer=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Total_2026','Total_2025'];
  const moLbl=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','2026 Total','2025 Total'];
  const rows=[{label:'Opening balance',m:'opening',cls:'rt'},{label:'Total inflows',m:'total_inflows',cls:'rsu'},{label:'Total outflows',m:'total_outflows',cls:'rsu'},{label:'Net movement',m:'net',cls:'rsu'},{label:'Closing balance',m:'closing',cls:'rt'}];
  const trs=rows.map(r=>{const cells=moPer.map(p=>{const v=r.m==='net'?g(_mco,'total_inflows',p)-g(_mco,'total_outflows',p):g(_mco,r.m,p);const isT=p==='Total_2026',isY25=p==='Total_2025';return`<td class="num ${v<0?'neg':'pos'} ${isT?'ytot':isY25?'ytot25':''}">${fmt(v)}</td>`;}).join('');return`<tr class="${r.cls}"><td class="lbl">${r.label}</td>${cells}</tr>`;}).join('');
  const ths=moLbl.map((l,i)=>`<th class="${moPer[i]==='Total_2026'?'ytot':moPer[i]==='Total_2025'?'ytot25':''}">${l}</th>`).join('');
  document.getElementById('mainContent').innerHTML=`
    <div class="sec"><div class="sec-title">&#9646; Monthly cash flow summary — 2026</div>
      <div class="cotabs">${coTabs}</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:10px">${COMPANIES[_mco].name} · AED 000's</div>
      <div class="scroll-x"><table class="dtbl"><thead><tr><th class="lbl">Description</th>${ths}</tr></thead><tbody>${trs}</tbody></table></div></div>`;
}

function renderGroup(){
  const moPer=MONTHS;
  const inByCo=CO_KEYS.map(co=>g(co,'total_inflows','Total_2026'));
  const outByCo=CO_KEYS.map(co=>g(co,'total_outflows','Total_2026'));
  const netByCo=inByCo.map((v,i)=>v-outByCo[i]);
  const clByCo=CO_KEYS.map(co=>g(co,'closing','Total_2026'));
  const gIn=inByCo.reduce((a,b)=>a+b,0),gOut=outByCo.reduce((a,b)=>a+b,0);
  const coRows=CO_KEYS.map((co,i)=>`<tr class="rd"><td class="lbl"><span class="co-pill" style="background:${COLORS[i]}18;color:${COLORS[i]}">${COMPANIES[co].short}</span>&nbsp;${COMPANIES[co].name}</td><td class="num pos">${fmt(inByCo[i])}</td><td class="num neg">${fmt(outByCo[i])}</td><td class="num ${netByCo[i]>=0?'pos':'neg'}">${fmt(netByCo[i])}</td><td class="num ${clByCo[i]>=0?'pos':'neg'}">${fmt(clByCo[i])}</td><td><button class="etab" style="font-size:10px;padding:2px 8px" onclick="goEntity('${co}')">Detail &rarr;</button></td></tr>`).join('');
  const stacked=CO_KEYS.map((co,i)=>({label:COMPANIES[co].short,data:moPer.map(p=>+Math.max(0,g(co,'total_inflows',p)).toFixed(1)),backgroundColor:COLORS[i]+'BB',borderColor:COLORS[i],borderWidth:1}));
  const grpLeg=CO_KEYS.map((co,i)=>`<div class="grp-row"><div class="grp-dot" style="background:${COLORS[i]}"></div><div style="flex:1">${COMPANIES[co].short} — ${COMPANIES[co].name}</div><div style="font-family:var(--mono);font-weight:500">${fmt(inByCo[i])}</div></div>`).join('');
  document.getElementById('mainContent').innerHTML=`
    <div class="sec"><div class="sec-title">&#9646; Group consolidated — 2026 annual summary</div>
      <div class="scroll-x"><table class="dtbl" style="min-width:500px"><thead><tr><th class="lbl">Company</th><th>Total inflows</th><th>Total outflows</th><th>Net movement</th><th>Closing balance</th><th>Detail</th></tr></thead>
      <tbody>${coRows}<tr class="rt"><td class="lbl">GROUP TOTAL</td><td class="num ytot">${fmt(gIn)}</td><td class="num ytot">${fmt(gOut)}</td><td class="num ytot ${(gIn-gOut)>=0?'pos':'neg'}">${fmt(gIn-gOut)}</td><td class="num ytot">${fmt(clByCo.reduce((a,b)=>a+b,0))}</td><td></td></tr></tbody></table></div></div>
    <div class="grid2">
      <div class="sec"><div class="sec-title">&#9646; Monthly inflows by company</div>
        <div class="chart-wrap"><canvas id="gc1" role="img" aria-label="Stacked monthly inflows"></canvas></div></div>
      <div class="sec"><div class="sec-title">&#9646; 2026 inflow share</div>
        <div class="chart-wrap-sm"><canvas id="gc2" role="img" aria-label="Inflow share doughnut"></canvas></div>
        <div style="margin-top:10px">${grpLeg}</div></div>
    </div>`;
  setTimeout(()=>{
    const c1=document.getElementById('gc1');
    if(c1)charts.gc1=new Chart(c1,{type:'bar',data:{labels:MONTHS,datasets:stacked},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{stacked:true,ticks:{font:{size:10},autoSkip:false,maxRotation:0}},y:{stacked:true,ticks:{callback:v=>fmtM(v),font:{size:9}},grid:{color:'#E8EBF2'}}}}});
    const c2=document.getElementById('gc2');
    if(c2)charts.gc2=new Chart(c2,{type:'doughnut',data:{labels:CO_KEYS.map(c=>COMPANIES[c].short),datasets:[{data:inByCo.map(v=>+Math.max(0,v).toFixed(1)),backgroundColor:COLORS,borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'58%'}});
  },60);
}

function exportCSV(){
  const periods=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Total_2026','Total_2025'];
  let csv='Company,Section,Line Item,'+periods.join(',')+'\n';
  CO_KEYS.forEach(co=>{(DETAIL[co]||[]).forEach(r=>{if(r.type==='section')return;csv+=`${COMPANIES[co].name},${r.type},${r.label},${periods.map(p=>(r.values?.[p]||0).toFixed(2)).join(',')}\n`;});});
  const b=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='AlLaithGroup_CashFlow.csv';a.click();
}

window.addEventListener('load',()=>refreshAll());
</script>
