<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Laith Group · Cash Flow Forecast</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--navy:#0D1B2A;--navy2:#162334;--blue:#1A5E9E;--blue-lt:#2E7DC4;--teal:#0E7B6B;--gold:#C08B1A;--red:#B03A2E;--green:#0E7B4A;--bg:#F4F6F9;--surface:#fff;--surface2:#EEF1F6;--border:#D8DDE8;--text:#0D1B2A;--text2:#5A6478;--text3:#8E97A8;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--r:8px;--rl:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--navy);padding:0 20px;height:54px;display:flex;align-items:center;gap:12px;flex-shrink:0;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.logo{font-size:14px;font-weight:600;color:#fff;white-space:nowrap}.logo em{color:#64A8E8;font-style:normal}
.badge{background:rgba(255,255,255,.1);color:rgba(255,255,255,.65);font-size:10px;padding:3px 8px;border-radius:20px;font-family:var(--mono);white-space:nowrap}
.live-dot{width:8px;height:8px;border-radius:50%;background:#2ECC71;animation:pulse 2s infinite;flex-shrink:0;display:none}
.live-label{font-size:11px;color:#2ECC71;font-weight:500;display:none}
.last-ref{font-size:10px;color:rgba(255,255,255,.35);font-family:var(--mono)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.topbar-right{margin-left:auto;display:flex;gap:7px;align-items:center}
.tb-sel{font-family:var(--font);font-size:12px;padding:4px 9px;border:1px solid rgba(255,255,255,.18);border-radius:var(--r);background:rgba(255,255,255,.07);color:#fff;height:30px;cursor:pointer;outline:none}
.tb-sel option{background:var(--navy)}
.tb-btn{font-family:var(--font);font-size:12px;padding:0 11px;height:30px;border:1px solid rgba(255,255,255,.18);border-radius:var(--r);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:background .15s}
.tb-btn:hover{background:rgba(255,255,255,.16)}
.tb-btn.primary{background:var(--blue);border-color:var(--blue-lt)}.tb-btn.primary:hover{background:var(--blue-lt)}
.tb-btn.warn{background:#9A6B00;border-color:#C08B1A}.tb-btn.warn:hover{background:#C08B1A}
.tabs-bar{background:var(--surface);border-bottom:1.5px solid var(--border);padding:0 20px;display:flex;overflow-x:auto;flex-shrink:0}
.tab{padding:11px 14px;font-size:13px;cursor:pointer;border-bottom:2.5px solid transparent;color:var(--text2);white-space:nowrap;transition:color .15s;user-select:none}
.tab:hover{color:var(--text)}.tab.active{border-bottom-color:var(--blue);color:var(--blue);font-weight:500}
#lbar{height:3px;background:var(--blue);width:0%;transition:width .3s;position:fixed;top:54px;left:0;z-index:200}
.lwrap{position:fixed;inset:0;background:rgba(244,246,249,.92);z-index:150;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.lwrap.show{display:flex}
.spin{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{font-size:13px;color:var(--text2)}
.main{flex:1;padding:18px 20px;overflow:auto;max-width:1500px;width:100%;margin:0 auto}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--rl) var(--rl) 0 0;background:var(--blue)}
.kpi.gr::before{background:var(--green)}.kpi.re::before{background:var(--red)}.kpi.go::before{background:var(--gold)}.kpi.te::before{background:var(--teal)}
.kpi-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;font-weight:500}
.kpi-v{font-size:20px;font-weight:600;letter-spacing:-.5px;font-family:var(--mono)}
.kpi-v.pos{color:var(--green)}.kpi-v.neg{color:var(--red)}
.kpi-s{font-size:10px;color:var(--text3);margin-top:2px}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:14px}
.sec-t{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.co-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px;margin-bottom:14px}
.co-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:11px 13px;transition:all .2s;cursor:pointer}
.co-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px)}
.co-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.co-nm{font-size:11px;font-weight:500;line-height:1.3}
.co-pill{font-size:10px;padding:2px 6px;border-radius:20px;font-family:var(--mono);white-space:nowrap}
.co-v{font-size:18px;font-weight:600;letter-spacing:-.5px;font-family:var(--mono)}
.co-v.pos{color:var(--green)}.co-v.neg{color:var(--red)}
.co-nt{font-size:10px;color:var(--text3);margin-top:1px}
.pbar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:7px}
.pfill{height:100%;border-radius:2px}
.co-ft{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:4px}
.wb{display:inline-block;background:#FEF3CD;color:#9A6B00;font-size:9px;padding:1px 5px;border-radius:3px;margin-left:4px;font-family:var(--mono)}
.chart-wrap{position:relative;width:100%;height:230px}
.chart-sm{position:relative;width:100%;height:180px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:680px){.g2{grid-template-columns:1fr}}
.leg{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:9px}
.leg-i{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.leg-d{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.sx{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* Detail table */
.dt{width:100%;border-collapse:collapse;font-size:11px;min-width:920px}
.dt th{background:var(--navy);color:rgba(255,255,255,.8);font-weight:500;padding:6px 8px;text-align:right;border:1px solid rgba(255,255,255,.07);white-space:nowrap;font-size:10px;position:sticky;top:0;z-index:2}
.dt th.lbl{text-align:left;min-width:190px;background:var(--navy2)}
.dt th.yt{background:#0A1520;color:#A0C4E8}.dt th.yt25{background:#0A1520;color:#7A9AB0}
.dt th.wk{background:#1A3A5C;color:#90B8D8;font-size:9px}
.dt th.mt{background:#0F2A45;color:#A0C8E8}
.dt td{padding:5px 8px;border:1px solid var(--border);text-align:right;white-space:nowrap;font-family:var(--mono);font-size:11px}
.dt td.lbl{text-align:left;font-family:var(--font);font-size:11px;padding-left:9px}
.dt td.lbl.ind{padding-left:20px;color:var(--text2)}
.dt tr.rs td{background:var(--navy);color:#fff;font-size:10px;font-weight:600;letter-spacing:.4px}
.dt tr.rt td{background:var(--navy2);color:#fff;font-weight:700}
.dt tr.rsu td{background:#EEF1F8;font-weight:600;color:var(--navy)}
.dt tr.rd:nth-child(even) td{background:#FAFBFD}
.dt tr.rd:hover td{background:#EEF4FF}
.dt td.pos{color:var(--green)}.dt td.neg{color:var(--red)}.dt td.mu{color:var(--text3)}
.dt tr.rt td.yt{background:#0A1520;color:#A0C4E8}.dt tr.rt td.yt25{background:#0A1520;color:#7A9AB0}
.dt tr.rsu td.yt{background:#1A3050;color:#A0C4E8}.dt tr.rsu td.yt25{background:#1A3050;color:#7A9AB0}
.dt tr.rd td.yt{background:#DDE8F5}.dt tr.rd td.yt25{background:#E8EEF4;color:var(--text3)}
.dt tr.rt td.wk,.dt tr.rt td.mt{background:#0A1520;color:#A0C4E8}
/* tabs */
.etabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.etab{font-size:11px;padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;font-family:var(--mono);font-weight:500}
.etab:hover{border-color:var(--blue);color:var(--blue)}
.etab.active{color:#fff;border-color:transparent;font-weight:600}
.cotabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.info-r{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text3);margin-bottom:9px;flex-wrap:wrap}
.grleg{display:flex;flex-direction:column;gap:4px}
.grleg-r{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text2)}
.grleg-d{width:11px;height:11px;border-radius:2px;flex-shrink:0}
.app-footer{background:var(--navy);color:rgba(255,255,255,.3);font-size:10px;padding:9px 20px;text-align:center;letter-spacing:.5px}
@media print{.topbar,.tabs-bar,.app-footer,.lwrap{display:none}.main{padding:0}.sec{break-inside:avoid}}
</style>
</head>

// ═══════════════════════════════════════════════
// CSV PARSER
// ═══════════════════════════════════════════════
function parseCSV(text){
  const rows=[];
  for(const line of text.split('\n')){
    const row=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"')inQ=!inQ;
      else if(c===','&&!inQ){row.push(cur.trim());cur='';}
      else cur+=c;
    }
    row.push(cur.trim());
    rows.push(row);
  }
  return rows;
}

function pn(v){
  if(v===undefined||v===null)return 0;
  const s=v.toString().replace(/,/g,'').replace(/"/g,'').trim();
  if(s===''||s==='-'||s==='—'||s==='-   ')return 0;
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}

function getCell(rows,ri,ci){
  if(ri>=rows.length)return 0;
  const row=rows[ri];
  if(ci>=row.length)return 0;
  return pn(row[ci]);
}

// ═══════════════════════════════════════════════
// AUTO-DETECT COLUMNS from header rows
// Scans rows 6-8 for date/period labels to find
// the correct column offsets dynamically
// ═══════════════════════════════════════════════
function detectColumns(rows){
  // Scan rows 5-8 (0-based) for period labels
  const periodMap={};
  for(let r=4;r<9;r++){
    const row=rows[r]||[];
    for(let c=100;c<row.length;c++){
      const v=(row[c]||'').toString().trim().toLowerCase();
      // Match week labels like "1-13", "14-20" etc and month TOT
      if(v.match(/^1-1[0-9]$|^1-13$/))  periodMap.Jan_W1=c;
      else if(v.match(/^14-20$/))         periodMap.Jan_W2=c;
      else if(v.match(/^21-27$/))         periodMap.Jan_W3=c;
      else if(v.match(/^28-3[12]?$/))     periodMap.Jan_W4=c;
      else if(v==='tot'&&!periodMap.Jan_TOT&&c>140) periodMap.Jan_TOT=c;
    }
  }
  // If detection works, use it; otherwise fall back to hardcoded
  return Object.keys(periodMap).length>3 ? periodMap : null;
}

// LOAD ONE COMPANY
// ═══════════════════════════════════════════════
async function loadCo(co){
  const res=await fetch(CSV_URLS[co]);
  if(!res.ok) throw new Error(`${co}: HTTP ${res.status}`);
  const text=await res.text();
  const rows=parseCSV(text);

  // Store raw rows for debugging
  ROWS_RAW[co]=rows;

  // Build summary: key metric -> period -> value
  const summary={};
  for(const [metric,ri] of Object.entries(ROW)){
    summary[metric]={};
    for(const [period,ci] of Object.entries(MO_IDX)){
      summary[metric][period]=getCell(rows,ri,ci);
    }
    for(const [period,ci] of Object.entries(WK_IDX)){
      summary[metric][period]=getCell(rows,ri,ci);
    }
  }
  DATA[co]=summary;
}

async function doRefresh(){
  showL('Connecting to Google Sheets...');
  setBar(5);
  const errs=[];
  const keys=CO_KEYS;
  for(let i=0;i<keys.length;i++){
    const co=keys[i];
    setLTxt(`Loading ${COMPANIES[co].name}...`);
    try{ await loadCo(co); }
    catch(e){ errs.push(e.message); console.warn(e); }
    setBar(5+(i+1)/keys.length*90);
  }
  setBar(100);
  dataLoaded=true;
  hideL();
  document.getElementById('liveDot').style.display='block';
  document.getElementById('liveLabel').style.display='block';
  const now=new Date();
  document.getElementById('lastRef').textContent=
    'Updated '+now.toLocaleTimeString('en-AE',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('dateBadge').textContent="AED 000's · LIVE";
  if(errs.length) console.warn('Load errors:',errs);
  render();
  // Auto-refresh every 15 minutes
  setTimeout(doRefresh, 15*60*1000);
}

function fmt(n){if(n===undefined||n===null||isNaN(n))return'—';return n.toLocaleString('en-AE',{minimumFractionDigits:1,maximumFractionDigits:1});}
function fmtM(n){const a=Math.abs(n);if(a>=1000)return(n<0?'-':'')+Math.abs(n/1000).toFixed(1)+'M';return(n<0?'-':'')+Math.abs(n).toFixed(0)+'K';}

  const chartIn=wkP.filter(p=>isTot(p)).map(p=>+(getCell(ROWS_RAW[_wco]||[],ROW.total_inflows,WK_IDX[p])).toFixed(1));
  const chartOut=wkP.filter(p=>isTot(p)).map(p=>+(getCell(ROWS_RAW[_wco]||[],ROW.total_outflows,WK_IDX[p])).toFixed(1));
  const chartLbls=wkP.filter(p=>isTot(p)).map(p=>p.replace('_TOT',''));

  document.getElementById('mc').innerHTML=`
    <div class="sec"><div class="sec-t">&#9646; Weekly cash flow — Jan to May 2026 (actuals)</div>
      <div class="cotabs">${coTabs}</div>
      <div class="info-r">${COMPANIES[_wco].name} &nbsp;·&nbsp; Weekly detail &nbsp;·&nbsp; AED 000's</div>
      <div class="sx"><table class="dt"><thead><tr><th class="lbl">Description</th>${ths}</tr></thead><tbody>${trs}</tbody></table></div></div>
    <div class="g2">
      <div class="sec"><div class="sec-t">&#9646; Monthly totals — inflows vs outflows</div>
        <div class="leg"><div class="leg-i"><div class="leg-d" style="background:${color}"></div>Inflows</div><div class="leg-i"><div class="leg-d" style="background:#B03A2E"></div>Outflows</div></div>
        <div class="chart-wrap"><canvas id="wc1" role="img" aria-label="Weekly monthly totals"></canvas></div></div>
      <div class="sec"><div class="sec-t">&#9646; Closing balance by week-end</div>
        <div class="chart-wrap"><canvas id="wc2" role="img" aria-label="Weekly closing balance"></canvas></div></div>
    </div>`;

  const chartCl=wkP.filter(p=>isTot(p)).map(p=>+(getCell(ROWS_RAW[_wco]||[],ROW.closing,WK_IDX[p])).toFixed(1));

  setTimeout(()=>{
    const c1=document.getElementById('wc1');
    if(c1)charts.wc1=new Chart(c1,{type:'bar',data:{labels:chartLbls,datasets:[
      {label:'In',data:chartIn,backgroundColor:color+'28',borderColor:color,borderWidth:1.5},
      {label:'Out',data:chartOut,backgroundColor:'#B03A2E28',borderColor:'#B03A2E',borderWidth:1.5}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{font:{size:11},autoSkip:false,maxRotation:0}},y:{ticks:{callback:v=>fmtM(v),font:{size:9}},grid:{color:'#E8EBF2'}}}}});
    const c2=document.getElementById('wc2');
    if(c2)charts.wc2=new Chart(c2,{type:'line',data:{labels:chartLbls,datasets:[
      {label:'Close',data:chartCl,borderColor:color,backgroundColor:color+'0E',fill:true,tension:0.25,pointRadius:5,pointBackgroundColor:color}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{font:{size:11},autoSkip:false,maxRotation:0}},y:{ticks:{callback:v=>fmtM(v),font:{size:9}},grid:{color:'#E8EBF2'}}}}});
  },60);
}

// ═══════════════════════════════════════════════
// MONTHLY SUMMARY
// ═══════════════════════════════════════════════
function renderMonthly(){
  if(!CO_KEYS.includes(_mco))_mco=CO_KEYS[0];
  const coTabs=CO_KEYS.map((c,i)=>`<button class="etab${_mco===c?' active':''}" style="${_mco===c?'background:'+COLORS[i]+';border-color:'+COLORS[i]:''}" onclick="_mco='${c}';renderMonthly()">${COMPANIES[c].short}</button>`).join('');

  const moPer=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Total_2026','Total_2025'];
  const moLbl=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','2026 Total','2025 Total'];

  const rows=[
    {label:'Opening balance',m:'opening',cls:'rt'},
    {label:'Total inflows',m:'total_inflows',cls:'rsu'},
    {label:'Total outflows',m:'total_outflows',cls:'rsu'},
    {label:'Net movement',m:'net',cls:'rsu'},
    {label:'Closing balance',m:'closing',cls:'rt'},
  ];

  const trs=rows.map(r=>{
    const cells=moPer.map((p,pi)=>{
      const ci=MO_IDX[p];
      const v=r.m==='net'
        ?(ci!==undefined?getCell(ROWS_RAW[_mco]||[],ROW.total_inflows,ci):0)-(ci!==undefined?getCell(ROWS_RAW[_mco]||[],ROW.total_outflows,ci):0)
        :(ci!==undefined?getCell(ROWS_RAW[_mco]||[],ROW[r.m],ci):0);
      const isT=p==='Total_2026',isY25=p==='Total_2025';
      return`<td class="num ${v<0?'neg':'pos'} ${isT?'yt':isY25?'yt25':''}">${fmt(v)}</td>`;
    }).join('');
    return`<tr class="${r.cls}"><td class="lbl">${r.label}</td>${cells}</tr>`;
  }).join('');

  const ths=moLbl.map((l,i)=>`<th class="${moPer[i]==='Total_2026'?'yt':moPer[i]==='Total_2025'?'yt25':''}">${l}</th>`).join('');

  document.getElementById('mc').innerHTML=`
    <div class="sec"><div class="sec-t">&#9646; Monthly cash flow summary — 2026</div>
      <div class="cotabs">${coTabs}</div>
      <div class="info-r">${COMPANIES[_mco].name} &nbsp;·&nbsp; Jan–May = actual weekly totals &nbsp;·&nbsp; Jun–Dec = monthly forecast &nbsp;·&nbsp; AED 000's</div>
      <div class="sx"><table class="dt"><thead><tr><th class="lbl">Description</th>${ths}</tr></thead><tbody>${trs}</tbody></table></div></div>`;
}

// ═══════════════════════════════════════════════
// GROUP VIEW
// ═══════════════════════════════════════════════
function renderGroup(){
  const inByCo=CO_KEYS.map(co=>g(co,'total_inflows','Total_2026'));
  const outByCo=CO_KEYS.map(co=>g(co,'total_outflows','Total_2026'));
  const netByCo=inByCo.map((v,i)=>v-outByCo[i]);
  const clByCo=CO_KEYS.map(co=>g(co,'closing','Dec'));
  const gIn=inByCo.reduce((a,b)=>a+b,0),gOut=outByCo.reduce((a,b)=>a+b,0);

  const coRows=CO_KEYS.map((co,i)=>`<tr class="rd">
    <td class="lbl"><span class="co-pill" style="background:${COLORS[i]}18;color:${COLORS[i]}">${COMPANIES[co].short}</span>&nbsp;${COMPANIES[co].name}</td>
    <td class="num pos">${fmt(inByCo[i])}</td><td class="num neg">${fmt(outByCo[i])}</td>
    <td class="num ${netByCo[i]>=0?'pos':'neg'}">${fmt(netByCo[i])}</td>
    <td class="num ${clByCo[i]>=0?'pos':'neg'}">${fmt(clByCo[i])}</td>
    <td><button class="etab" style="font-size:10px;padding:2px 7px" onclick="goE('${co}')">Detail &rarr;</button></td>
  </tr>`).join('');

  const stacked=CO_KEYS.map((co,i)=>({
    label:COMPANIES[co].short,
    data:MONTHS.map(p=>+Math.max(0,g(co,'total_inflows',p)).toFixed(1)),
    backgroundColor:COLORS[i]+'BB',borderColor:COLORS[i],borderWidth:1
  }));

  const grLeg=CO_KEYS.map((co,i)=>`<div class="grleg-r"><div class="grleg-d" style="background:${COLORS[i]}"></div><div style="flex:1">${COMPANIES[co].short} — ${COMPANIES[co].name}</div><div style="font-family:var(--mono);font-weight:500">${fmt(inByCo[i])}</div></div>`).join('');

  document.getElementById('mc').innerHTML=`
    <div class="sec"><div class="sec-t">&#9646; Group consolidated — 2026 annual summary</div>
      <div class="sx"><table class="dt" style="min-width:480px">
        <thead><tr><th class="lbl">Company</th><th>Total inflows</th><th>Total outflows</th><th>Net movement</th><th>Closing (Dec)</th><th>Detail</th></tr></thead>
        <tbody>${coRows}
          <tr class="rt"><td class="lbl">GROUP TOTAL</td>
            <td class="num yt">${fmt(gIn)}</td><td class="num yt">${fmt(gOut)}</td>
            <td class="num yt ${(gIn-gOut)>=0?'pos':'neg'}">${fmt(gIn-gOut)}</td>
            <td class="num yt">${fmt(clByCo.reduce((a,b)=>a+b,0))}</td><td></td></tr>
        </tbody></table></div></div>
    <div class="g2">
      <div class="sec"><div class="sec-t">&#9646; Monthly inflows by company</div>
        <div class="chart-wrap"><canvas id="gc1" role="img" aria-label="Stacked monthly inflows"></canvas></div></div>
      <div class="sec"><div class="sec-t">&#9646; 2026 inflow share</div>
        <div class="chart-sm"><canvas id="gc2" role="img" aria-label="Inflow share doughnut"></canvas></div>
        <div style="margin-top:10px" class="grleg">${grLeg}</div></div>
    </div>`;

  setTimeout(()=>{
    const c1=document.getElementById('gc1');
    if(c1)charts.gc1=new Chart(c1,{type:'bar',data:{labels:MONTHS,datasets:stacked},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{stacked:true,ticks:{font:{size:10},autoSkip:false,maxRotation:0}},y:{stacked:true,ticks:{callback:v=>fmtM(v),font:{size:9}},grid:{color:'#E8EBF2'}}}}});
    const c2=document.getElementById('gc2');
    if(c2)charts.gc2=new Chart(c2,{type:'doughnut',data:{labels:CO_KEYS.map(c=>COMPANIES[c].short),
      datasets:[{data:inByCo.map(v=>+Math.max(0,v).toFixed(1)),backgroundColor:COLORS,borderWidth:2,borderColor:'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'58%'}});
  },60);
}

// ═══════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════
function exportCSV(){
  const moPer=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Total_2026','Total_2025'];
  let csv='Company,Line Item,Type,'+moPer.join(',')+'\n';
  CO_KEYS.forEach(co=>{
    DETAIL_ROWS.forEach(r=>{
      if(r.section||!r.ri||ROW[r.ri]===undefined)return;
      const ri=ROW[r.ri];
      const vals=moPer.map(p=>{const ci=MO_IDX[p];return ci!==undefined?getCell(ROWS_RAW[co]||[],ri,ci).toFixed(2):'0';});
      csv+=`${COMPANIES[co].name},${r.label},${r.type},${vals.join(',')}\n`;
    });
  });
  const b=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='AlLaithGroup_CashFlow_2026.csv';
  a.click();
}

// Start
window.addEventListener('load',()=>doRefresh());
</script>
